<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Certificate</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eee;
padding:20px;
}

.certificate{

width:297mm;
height:210mm;

background:white;

margin:auto;

position:relative;

overflow:hidden;

border:12px solid #111;
}

/* TOP LOGO */

.logo{

text-align:center;
margin-top:25px;
}

.logo img{

height:90px;
}

/* TITLE */

.title{

text-align:center;
margin-top:10px;
}

.title h1{

font-size:72px;
font-weight:900;
color:#111;
}

.title h2{

font-size:42px;
color:#ff9800;
}

/* CERTIFICATE NO */

.cert-no{

position:absolute;
top:30px;
right:40px;

font-weight:bold;
}

/* CONTENT */

.content{

text-align:center;
padding:20px 80px;
margin-top:20px;
}

.presented{

font-size:22px;
margin-bottom:20px;
}

.student-name{

font-size:52px;
font-weight:bold;

color:#ff9800;

margin-bottom:25px;

text-transform:uppercase;
}

.course{

font-size:30px;

font-weight:bold;

margin:20px 0;

color:#111;
}

.description{

font-size:22px;

line-height:1.7;
}

/* FOOTER */

.footer{

position:absolute;

bottom:40px;

left:0;

right:0;

display:flex;

justify-content:space-around;

align-items:center;
}

.box{

text-align:center;
}

.box img{

height:100px;
}

.sign{

height:90px !important;
}

.line{

width:220px;

border-top:2px solid #111;

margin-bottom:10px;
}

/* PRINT */

.print-btn{

position:fixed;

right:20px;

top:20px;

padding:12px 20px;

background:#ff9800;

border:none;

font-weight:bold;

cursor:pointer;
}

@media print{

.print-btn{
display:none;
}

body{
background:white;
padding:0;
}

.certificate{

border:none;
margin:0;
width:100%;
height:100vh;
}

}

</style>
</head>

<body>

<button
class="print-btn"
onclick="window.print()">
Print Certificate
</button>

<div class="certificate">

<div class="cert-no" id="certNo"></div>

<div class="logo">
<img src="images/logo.jpg">
</div>

<div class="title">

<h1>CERTIFICATE</h1>

<h2>OF COMPLETION</h2>

</div>

<div class="content">

<div class="presented">

This Certificate Is Proudly Presented To

</div>

<div
class="student-name"
id="studentName">
</div>

<div class="description">

For successfully completing

</div>

<div
class="course"
id="courseName">
</div>

<div class="description">

Conducted by TurbanCreations.

Your dedication and commitment
to learning the art of Turban Styling
are highly appreciated.

</div>

</div>

<div class="footer">

<div class="box">

<div class="line"></div>

<div id="completionDate"></div>

<b>Completion Date</b>

</div>

<div class="box">

<img
src="images/stamp.jpeg">

</div>

<div class="box">

<img
src="images/sign.png"
class="sign">

<div class="line"></div>

<b>Ajit Singh</b><br>

Founder & Trainer

</div>

</div>

</div>

<script>

const student =
JSON.parse(
localStorage.getItem(
"certificateStudent"
)
) || {};

document.getElementById(
"studentName"
).innerText =
student.name || "";

document.getElementById(
"courseName"
).innerText =
student.course || "";

document.getElementById(
"completionDate"
).innerText =
student.completionDate
|| new Date().toLocaleDateString();

document.getElementById(
"certNo"
).innerHTML =
"Certificate No: " +
(
student.certificateNo ||
("TC-CERT-" +
Date.now()
.toString()
.slice(-5))
);

</script>

</body>
</html>
